<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form 表单标签演示</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main class="workspace">
    <section class="panel">
      <header class="panel-head"><span>源代码</span><span>HTML</span></header>
      <div class="source-wrap"><ol class="source-code" id="source-code"></ol></div>
    </section>
    <section class="panel">
      <header class="panel-head"><span>运行结果</span><a href="common-tags.html">返回目录</a></header>
      <iframe class="result-frame" id="result-frame" title="表单标签运行结果"></iframe>
    </section>
  </main>

  <script type="text/plain" id="demo-source"><!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>表单标签</title>
</head>
<body>
  <form action="#">
    <label for="username">用户名：</label>
    <input
      type="text"
      id="username"
      name="username"
      placeholder="请输入用户名"
    >

    <br><br>

    <label for="city">所在城市：</label>
    <select id="city" name="city">
      <option value="">请选择城市</option>
      <option value="beijing">北京</option>
      <option value="shanghai">上海</option>
      <option value="shenzhen">深圳</option>
    </select>

    <br><br>

    <label for="introduction">个人简介：</label>
    <br>
    <textarea
      id="introduction"
      name="introduction"
      rows="5"
      cols="35"
      placeholder="请输入个人简介"
    ></textarea>

    <br><br>

    <button type="submit">提交</button>
  </form>
</body>
</html></script>
  <script src="demo.js"></script>
</body>
</html>
