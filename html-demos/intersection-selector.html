<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交集选择器演示</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main class="workspace">
    <section class="panel">
      <header class="panel-head"><span>源代码</span><span>HTML + CSS</span></header>
      <div class="source-wrap"><ol class="source-code" id="source-code"></ol></div>
    </section>
    <section class="panel">
      <header class="panel-head"><span>运行结果</span><a href="common-tags.html">返回目录</a></header>

  <script type="text/plain" id="demo-source"><!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>交集选择器</title>

    /* 同时满足：p 标签并且 class 为 red */
    p.red {
      color: red;
    }
  </style>
</head>
<body>
  <h1 class="title">第一段</h1>
  <p>第二段</p>
  <p class="red">第三段</p>
  <div class="title">第四段</div>
</body>
</html></script>
  <script src="demo.js"></script>

</html>
