<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试一下：复选框</title>
  <link rel="stylesheet" href="../playground.css">
</head>
<body>
  <header class="toolbar">
    <div class="heading">
      <h1>HTML 表单练习：复选框</h1>
      <p>修改左侧代码，然后点击“运行代码”查看效果。</p>
    </div>
    <button id="run" type="button">运行代码</button>
    <button id="reset" class="secondary" type="button">恢复示例</button>
  </header>

  <main class="workspace">
    <section class="panel">
      <h2 class="panel-title">代码</h2>
      <textarea id="code" spellcheck="false"><!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>复选框</title>
</head>
<body>
  <p>请选择感兴趣的内容：</p>

  <label>
    <input type="checkbox" name="interest" value="html">
    HTML
  </label>

  <label>
    <input type="checkbox" name="interest" value="css">
    CSS
  </label>
</body>
</html></textarea>
      <div class="tip">快捷键：按 Ctrl + Enter 也可以运行代码。</div>
    </section>

    <section class="panel">
      <h2 class="panel-title">运行效果</h2>
      <iframe id="preview" title="复选框运行效果" sandbox="allow-forms"></iframe>
    </section>
  </main>

  <script src="../playground.js"></script>
</body>
</html>
