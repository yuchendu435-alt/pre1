<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试一下：CSS 盒模型</title>
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <header class="toolbar">
    <div class="heading">
      <h1>CSS 练习：盒模型</h1>
      <p>修改左侧代码，然后点击“运行代码”查看效果。</p>
    </div>
    <button id="run" type="button">运行代码</button>
    <button id="reset" class="secondary" type="button">恢复示例</button>
  </header>

  <main class="workspace">
    <section class="panel">
      <h2 class="panel-title">代码</h2>
      <textarea id="code" spellcheck="false"><!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒模型</title>
  <style>
    .box {
      width: 240px;
      margin: 16px;
      padding: 24px;
      border: 6px solid #2563eb;
      background: #dbeafe;
    }

    .content-box {
      box-sizing: content-box;
    }

    .border-box {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="box content-box">content-box</div>
  <div class="box border-box">border-box</div>
</body>
</html></textarea>
      <div class="tip">快捷键：按 Ctrl + Enter 也可以运行代码。</div>
    </section>

    <section class="panel">
      <h2 class="panel-title">运行效果</h2>
      <iframe id="preview" title="CSS 盒模型示例运行效果" sandbox=""></iframe>
    </section>
  </main>

  <script src="playground.js"></script>
</body>
</html>
